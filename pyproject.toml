[project]
name = "deepfield-multimodal"
version = "0.1.0"
description = "Multimodal agent pack for enterprise signal classification and action loops"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29"]
media = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = [
    "E501",   # line-too-long — existing codebase style
    "E701",   # multiple-statements-on-one-line — existing pattern
    "E402",   # module-import-not-at-top — existing pattern
    "E741",   # ambiguous-variable-name
    "F401",   # unused-import — 35 existing violations, separate cleanup
    "F841",   # unused-variable
    "UP007",  # non-pep604-annotation-union — existing Optional[] style
    "UP017",  # datetime-timezone-utc — existing datetime.utcnow() pattern
    "UP035",  # deprecated-import — typing imports
    "UP037",  # quoted-annotation — forward refs
    "UP045",  # non-pep604-annotation-optional — Optional[] style
    "UP042",  # replace-str-enum
]

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["F401", "F841"]
